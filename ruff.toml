# Ruff configuration for Photo Editor 2
target-version = "py310"

# Legacy / experimental modules not used by the application entry point
# (photo_editor.py). Kept in the repo for reference, but not linted.
extend-exclude = [
    "ui/develop",
    "ui/library",
    "ui/navigator",
    "main.py",
    "main_advanced.py",
    "updater.py",
    "updater_advanced.py",
    "update_manager_with_ui.py",
    "unified_updater_fixed.py",
    "unified_updater_final.py",
]

[lint]
# Core correctness rules (E-syntax, pyflakes)
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Re-exports by design
"**/__init__.py" = ["F401"]
# Intentional late import to avoid a circular dependency
"ui/history_dialog.py" = ["E402"]
