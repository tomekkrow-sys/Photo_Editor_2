name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libgomp1 libfontconfig1 libxkbcommon0 libdbus-1-3
        sudo apt-get install -y libglib2.0-0t64 || sudo apt-get install -y libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-qt ruff

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Run tests with Pytest
      run: |
        set -o pipefail
        status=0
        pytest -v 2>&1 | tee pytest.log || status=$?
        if [ "$status" -ne 0 ]; then
          python3 -c 'import pathlib; log=pathlib.Path("pytest.log").read_text(errors="replace"); esc="\n".join(log.splitlines()[-150:]).replace("%","%25").replace("\r","").replace("\n","%0A"); print("::error title=pytest failed:: "+esc)'
          exit "$status"
        fi
