name: Build Windows EXE + macOS APP + Debian DEB

on:
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed
          --name Photo_Editor_2
          --collect-all rawpy
          photo_editor.py

      - name: Get version
        id: version
        shell: bash
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_OUTPUT

      - name: Zip package
        run: Compress-Archive -Path dist/Photo_Editor_2 -DestinationPath Photo_Editor_2-windows-v${{ steps.version.outputs.VERSION }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo_Editor_2-windows
          path: Photo_Editor_2-windows-v*.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build DEB
        run: ./build_deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo_Editor_2-debian
          path: photo-editor-2_*_amd64.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build APP (PyInstaller)
        run: >
          pyinstaller --noconfirm --windowed
          --name Photo_Editor_2
          --collect-all rawpy
          photo_editor.py

      - name: Zip package
        run: ditto -c -k --sequesterRsrc --keepParent dist/Photo_Editor_2.app Photo_Editor_2-macos-v$(cat version.txt).zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Photo_Editor_2-macos
          path: Photo_Editor_2-macos-v*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Photo_Editor_2-windows/Photo_Editor_2-windows-v*.zip
            artifacts/Photo_Editor_2-debian/photo-editor-2_*_amd64.deb
            artifacts/Photo_Editor_2-macos/Photo_Editor_2-macos-v*.zip
          generate_release_notes: true
